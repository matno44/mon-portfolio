name: Veille Auto

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

# Important pour avoir le droit de push le code
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install libs
        run: pip install feedparser openai

      - name: Run script
        # C'est ICI que la magie opère : on passe la clé au script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python automate_veille.py

      - name: Commit updated veille
        run: |
          git config --global user.name "github-bot"
          git config --global user.email "bot@example.com"
          git add .
          # La ligne suivante ne fait le commit que s'il y a des changements
          git diff --staged --quiet || (git commit -m "Mise à jour veille" && git push)
