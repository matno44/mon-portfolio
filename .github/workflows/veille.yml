name: Veille Auto

on:
  schedule:
    - cron: "0 8 * * 1"   # tous les lundis à 8h (heure FR)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install libs
        run: pip install feedparser openai

      - name: Run script
        run: python automate_veille.py

      - name: Commit updated veille
        run: |
          git config --global user.name "github-bot"
          git config --global user.email "bot@example.com"
          git add .
          git commit -m "Mise à jour veille automatique"
          git push
