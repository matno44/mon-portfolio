<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <title>Toutes les fiches de révision - Matisse KRA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, rgba(15, 32, 39, 0.9), rgba(32, 58, 67, 0.9)), 
                        url('https://images.unsplash.com/photo-1518770660439-4636190af475?ixlib=rb-4.0.3&auto=format&fit=crop&w=1500&q=80') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Tangerine', cursive;
            font-size: clamp(40px, 8vw, 80px);
            text-align: center;
            color: #fff;
            margin-bottom: 50px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            font-weight: 700;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            width: 100%;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .card-image-container {
            width: 100%;
            height: 250px;
            overflow: hidden;
            position: relative;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card:hover .card-image {
            transform: scale(1.1);
        }

        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.7));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card:hover .card-overlay {
            opacity: 1;
        }

        .card-content {
            padding: 30px;
            text-align: center;
        }

        .card-title {
            font-size: clamp(24px, 3vw, 36px);
            font-weight: 600;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            transition: color 0.3s ease;
        }

        .card:hover .card-title {
            color: #4FC3F7;
        }

        .card-description {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            margin-top: 10px;
        }

        .footer {
            margin-top: 50px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .cards-container {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            h1 {
                margin-bottom: 30px;
            }
        }

        /* Animation au chargement */
        .card {
            animation: slideUp 0.6s ease-out forwards;
            opacity: 0;
        }

        .card:nth-child(1) {
            animation-delay: 0.2s;
        }

        .card:nth-child(2) {
            animation-delay: 0.4s;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
            from {
                opacity: 0;
                transform: translateY(30px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mes Fiches de Révision</h1>
        
        <div class="cards-container">
            <div class="card">
                <a href="revision-reseaux.html" class="card-link" aria-label="Accéder à la révision réseaux">
                    <div class="card-image-container">
                        <img src="https://placehold.co/600x400/0a0e27/00d9ff?text=R%C3%A9seaux+%26+Archi" 
                             alt="Fiche révision réseaux" 
                             class="card-image">
                        <div class="card-overlay"></div>
                    </div>
                    <div class="card-content">
                        <h2 class="card-title">Révision Réseaux</h2>
                        <p class="card-description">
                            IPv4, Codage binaire, OSI, Sous-réseaux et Sécurité.
                        </p>
                    </div>
                </a>
            </div>
        
            <div class="cards-container">
            <div class="card">
                <a href="revision-cybersecurite (1).html" class="card-link" aria-label="Accéder à la révision cybersecurite">
                    <div class="card-image-container">
                        <img src="https://www.apixit.fr/wp-content/uploads/2022/02/APIXIT-cybersecurite-SASE-SSE-1024x585.jpg"
                             alt="Fiche révision cybescurité" 
                             class="card-image">
                        <div class="card-overlay"></div>
                    </div>
                    <div class="card-content">
                        <h2 class="card-title">Révision cybersecurité</h2>
                        <p class="card-description">
                            vunérabilité, malware, DDOS...
                        </p>
                    </div>
                </a>
            </div>

            </div>

        <div class="footer">
            <p>© 2026 Matisse KRA - BTS SIO</p>
        </div>
    </div>
</body>
</html>
