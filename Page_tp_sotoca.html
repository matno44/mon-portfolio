    <style>
        body{
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1518770660439-4636190af475?ixlib=rb-4.0.3&auto=format&fit=crop&w=1500&q=80') no-repeat center center fixed;             
        }

        header{
            text-align: center;
            color: beige;
        }
        article>.TP {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: auto;
            width: 70%;
        }
        .TP div {
            flex: 0 0 150px;
            height: 150px;
            background-size: cover;
            background-position: center;
            margin: 10px;
            border-radius: 10px;
            position: relative;
            box-shadow: 5px 4px 15px rgba(4, 54, 135, 0.7);
            position: relative;
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px) saturate(180%);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: 0.35s ease;
        }
        
            

        /* Glow et verre amplifié */
        .TP div:hover {
            transform: scale(1.07);
            transform: perspective(600px) rotateX(8deg) rotateY(8deg) scale(1.05);
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.45),
                        0 0 15px rgba(0, 150, 255, 0.4);
            backdrop-filter: blur(14px) saturate(200%);
        }
        .TP div .Compte_rendu {
        position: absolute;
        background: rgba(0, 0, 0, 0.4);
        color: #fff;
        padding: 5px 10px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: bold;
        backdrop-filter: blur(2px);
        }

        .TP div:nth-child(1){ background: url(https://i.pinimg.com/736x/c4/18/5b/c4185be9987e1b97257fa43e0798b35a.jpg) center/cover no-repeat; }
        .TP div:nth-child(2){ background: url(https://hypertecsp.com/wp-content/uploads/Network-Repair.jpg) center/cover no-repeat; }
        .TP div:nth-child(3){ background: url(https://cours-informatique-gratuit.fr/wp-content/uploads/2014/05/capture-ecran.png) center/cover no-repeat; }
        .TP div:nth-child(4){ background: url(https://1.bp.blogspot.com/-TIJbcNZw7xY/XQ6VjtGJjKI/AAAAAAAAE3Y/PpSwRIrI--U-Dt5sWDH7nc8f0Ue85KNTACLcBGAs/s1600/ping.png) center/cover no-repeat; }
        .TP div:nth-child(5){ background: url(https://www.ionos.fr/digitalguide/fileadmin/DigitalGuide/Server/network-attached-storage-c.jpg) center/cover no-repeat; }
