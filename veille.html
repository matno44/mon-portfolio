veille.html : <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matisse KRA - Veille Technologique</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4e54c8;
            --secondary-color: #8f94fb;
            --dark-color: #1f1f1f;
            --light-color: #f8f9fa;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1518770660439-4636190af475?ixlib=rb-4.0.3&auto=format&fit=crop&w=1500&q=80') no-repeat center center fixed;
            background-size: cover;
            color: var(--light-color);
            overflow-x: hidden;
            min-height: 100vh;
        }

        #content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .section {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .section-title {
            position: relative;
            padding-bottom: 15px;
            margin-bottom: 30px;
            font-weight: 700;
            color: #fff;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 4px;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            border-radius: 2px;
        }

        /* Liens du tableau */
        .veille-link {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .veille-link:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* Badge responsive */
        .badge { font-weight: 500; letter-spacing: 0.5px; }

        .text-muted { --bs-text-opacity: 1; color: #ffffffb0 !important; }
    </style>
</head>
<body>

    <header class="header-section text-center">
        <h1>Tableau de Veille Technologique</h1>
        <p class="lead">BTS SIO - Option SLAM/SISR</p>
    </header>

    <div class="container mb-5">
        <div class="table-container table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th style="width: 10%">Date</th>
                        <th style="width: 10%">Catégorie</th>
                        <th style="width: 20%">Titre</th>
                        <th style="width: 10%">Source</th>
                        <th style="width: 10%">Outil de veille</th>
                        <th style="width: 5%">Lien</th>
                        <th style="width: 35%">Analyse personnelle</th>
                    </tr>
                </thead>
                <tbody id="historique-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        fetch('historique.json')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('historique-body');
                
                // On affiche tout l'historique (ou les 50 derniers) pour montrer la durée
                data.slice(0, 50).forEach(item => {
                    const row = `
                        <tr>
                            <td><strong>${item.date}</strong></td>
                            <td><span class="badge bg-secondary badge-cat">${item.category}</span></td>
                            <td class="fw-bold text-primary">${item.title}</td>
                            <td>${item.source}</td>
                            <td>${item.tool}</td>
                            <td class="text-center">
                                <a href="${item.link}" target="_blank" class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-link"></i>
                                </a>
                            </td>
                            <td>
                                <div class="analyse-text">
                                    ${item.analysis}
                                </div>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('Erreur:', error);
                document.getElementById('historique-body').innerHTML = '<tr><td colspan="7" class="text-center text-danger">Erreur de chargement des données (historique.json manquant ?)</td></tr>';
            });
    </script>
</body>
</html>
