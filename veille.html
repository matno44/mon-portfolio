<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veille Technologique - BTS SIO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-section { background: linear-gradient(135deg, #0d6efd, #0a58ca); color: white; padding: 40px 0; margin-bottom: 30px; }
        .table-container { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; }
        
        /* Style du tableau proche du modèle */
        .table thead th { 
            background-color: #3498db; 
            color: white; 
            font-weight: 600; 
            border: none;
        }
        .badge-cat { font-size: 0.85em; padding: 5px 10px; }
        .analyse-text { font-style: italic; color: #555; font-size: 0.95rem; border-left: 3px solid #3498db; padding-left: 10px; }
    </style>
</head>
<body>

    <header class="header-section text-center">
        <h1>Tableau de Veille Technologique</h1>
        <p class="lead">BTS SIO - Option SLAM/SISR</p>
    </header>

    <div class="container mb-5">
        <div class="table-container table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th style="width: 10%">Date</th>
                        <th style="width: 10%">Catégorie</th>
                        <th style="width: 20%">Titre</th>
                        <th style="width: 10%">Source</th>
                        <th style="width: 10%">Outil de veille</th>
                        <th style="width: 5%">Lien</th>
                        <th style="width: 35%">Analyse personnelle</th>
                    </tr>
                </thead>
                <tbody id="historique-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        fetch('historique.json')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('historique-body');
                
                // On affiche tout l'historique (ou les 50 derniers) pour montrer la durée
                data.slice(0, 50).forEach(item => {
                    const row = `
                        <tr>
                            <td><strong>${item.date}</strong></td>
                            <td><span class="badge bg-secondary badge-cat">${item.category}</span></td>
                            <td class="fw-bold text-primary">${item.title}</td>
                            <td>${item.source}</td>
                            <td>${item.tool}</td>
                            <td class="text-center">
                                <a href="${item.link}" target="_blank" class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-link"></i>
                                </a>
                            </td>
                            <td>
                                <div class="analyse-text">
                                    ${item.analysis}
                                </div>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('Erreur:', error);
                document.getElementById('historique-body').innerHTML = '<tr><td colspan="7" class="text-center text-danger">Erreur de chargement des données (historique.json manquant ?)</td></tr>';
            });
    </script>
</body>
</html>
