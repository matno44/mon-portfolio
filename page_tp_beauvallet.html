        header{
            text-align: center;

        article>.TP {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: auto;
            width: 70%;
        }
        .TP div {
            flex: 0 0 150px;
            height: 150px;
            background-size: cover;
            background-position: center;
            margin: 10px;
            border-radius: 10px;
            position: relative;
            box-shadow: 5px 4px 15px rgba(4, 54, 135, 0.7);
            position: relative;
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px) saturate(180%);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: 0.35s ease;
        }
        
            

        /* Glow et verre amplifié */
        .TP div:hover {
            transform: scale(1.07);
            transform: perspective(600px) rotateX(8deg) rotateY(8deg) scale(1.05);
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.45),
                        0 0 15px rgba(0, 150, 255, 0.4);
            backdrop-filter: blur(14px) saturate(200%);
        }
        .TP div .Compte_rendu {
        position: absolute;
        background: rgba(0, 0, 0, 0.4);
        color: #fff;
        padding: 5px 10px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: bold;
        backdrop-filter: blur(2px);
        }
